<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean monochrome white vector artwork with true transparency for Homey App Icon -->
  <defs>
    <mask id="slash-gap">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <!-- Black stroke cuts out negative space around the diagonal slash -->
      <line x1="290" y1="430" x2="430" y2="290" stroke="#000000" stroke-width="30" stroke-linecap="round"/>
    </mask>
  </defs>

  <g fill="#ffffff">
    <!-- 1. Parking P (Top-Left weighted) -->
    <path fill-rule="evenodd" d="M 85 70 H 245 C 315 70 355 110 355 180 C 355 250 315 290 245 290 H 160 V 442 H 85 Z M 160 140 V 220 H 240 C 268 220 285 205 285 180 C 285 155 268 140 240 140 Z"/>

    <!-- 2. +15% with masked cutout behind slash -->
    <g mask="url(#slash-gap)">
      <!-- Ring -->
      <path fill-rule="evenodd" d="M 360 360 m -100 0 a 100 100 0 1 0 200 0 a 100 100 0 1 0 -200 0 Z M 360 360 m -78 0 a 78 78 0 1 1 156 0 a 78 78 0 1 1 -156 0 Z"/>
      <!-- +15% Text -->
      <text x="360" y="380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">+15%</text>
    </g>

    <!-- 3. Diagonal Prohibition Slash -->
    <line x1="290" y1="430" x2="430" y2="290" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>

