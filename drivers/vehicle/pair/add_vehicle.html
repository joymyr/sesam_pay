<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title id="page-title">Add Vehicle</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="text"], input[type="number"], input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }
    .error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn:disabled {
      background-color: #b0c4de;
      cursor: not-allowed;
    }
  </style>
  <script type="text/javascript" src="/homey.js" data-origin="pair"></script>
</head>
<body>
  <div class="form-group">
    <label id="lbl-name" for="name">Vehicle Name</label>
    <input type="text" id="name" placeholder="e.g. Ford Mustang Mach-E">
    <div id="hint-name" class="hint">A recognizable name for this vehicle in Homey.</div>
  </div>

  <div class="form-group">
    <label id="lbl-reg" for="regNumber">License Plate (Required)</label>
    <input type="text" id="regNumber" placeholder="e.g. EC66453" style="text-transform: uppercase;">
    <div id="hint-reg" class="hint">Registration number to monitor on sesam-sesam.com.</div>
  </div>

  <div class="form-group">
    <label id="lbl-poll" for="pollInterval">Check Interval (Minutes)</label>
    <input type="number" id="pollInterval" value="30" min="5" max="1440">
    <div id="hint-poll" class="hint">How often to check for unpaid parking (default: 30 minutes).</div>
  </div>

  <div class="form-group">
    <label id="lbl-email" for="email">Receipt Email (Optional)</label>
    <input type="email" id="email" placeholder="your.email@example.com">
  </div>

  <div id="error" class="error"></div>
  <button id="submitBtn" class="btn" onclick="saveVehicle()">Add Vehicle</button>

  <script>
    const I18N = {
      en: {
        title: "Add Vehicle",
        name_label: "Vehicle Name",
        name_ph: "e.g. Ford Mustang Mach-E",
        name_hint: "A recognizable name for this vehicle in Homey.",
        reg_label: "License Plate (Required)",
        reg_ph: "e.g. EC66453",
        reg_hint: "Registration number to monitor on sesam-sesam.com.",
        poll_label: "Check Interval (Minutes)",
        poll_hint: "How often to check for unpaid parking (default: 30 minutes).",
        email_label: "Receipt Email (Optional)",
        email_ph: "your.email@example.com",
        btn_add: "Add Vehicle",
        btn_checking: "Checking Sesam Sesam...",
        err_invalid_reg: "Please enter a valid license plate."
      },
      no: {
        title: "Legg til kjøretøy",
        name_label: "Kjøretøynavn",
        name_ph: "f.eks. Ford Mustang Mach-E",
        name_hint: "Et gjenkjennelig navn for bilen i Homey.",
        reg_label: "Registreringsnummer (Påkrevd)",
        reg_ph: "f.eks. EC66453",
        reg_hint: "Bilskiltet som skal overvåkes på sesam-sesam.com.",
        poll_label: "Sjekkintervall (Minutter)",
        poll_hint: "Hvor ofte det skal søkes etter ubetalt parkering (standard: 30 min).",
        email_label: "E-post for kvittering (Valgfritt)",
        email_ph: "din.epost@eksempel.no",
        btn_add: "Legg til kjøretøy",
        btn_checking: "Sjekker Sesam Sesam...",
        err_invalid_reg: "Vennligst oppgi et gyldig registreringsnummer."
      }
    };

    let homeyInstance = null;

    function getLang() {
      try {
        let str = '';
        const h = (typeof homeyInstance !== 'undefined' && homeyInstance) || window.Homey;
        if (h) {
          if (typeof h.language === 'string') {
            str = h.language;
          } else if (typeof h.getLanguage === 'string') {
            str = h.getLanguage;
          }
        }

        if (!str && typeof navigator !== 'undefined') {
          str = navigator.language || navigator.userLanguage || '';
        }
        str = String(str || '').toLowerCase();
        if (str.indexOf('no') === 0 || str.indexOf('nb') === 0 || str.indexOf('nn') === 0) {
          return 'no';
        }
        return 'en';
      } catch (e) {
        return 'en';
      }
    }

    function onHomeyReady(Homey) {
      homeyInstance = Homey;
      if (typeof Homey.ready === 'function') {
        Homey.ready();
      }
      applyTranslations();
    }

    function applyTranslations() {
      const t = I18N[getLang()];
      document.title = t.title;
      document.getElementById('lbl-name').textContent = t.name_label;
      document.getElementById('name').placeholder = t.name_ph;
      document.getElementById('hint-name').textContent = t.name_hint;
      document.getElementById('lbl-reg').textContent = t.reg_label;
      document.getElementById('regNumber').placeholder = t.reg_ph;
      document.getElementById('hint-reg').textContent = t.reg_hint;
      document.getElementById('lbl-poll').textContent = t.poll_label;
      document.getElementById('hint-poll').textContent = t.poll_hint;
      document.getElementById('lbl-email').textContent = t.email_label;
      document.getElementById('email').placeholder = t.email_ph;
      document.getElementById('submitBtn').textContent = t.btn_add;
    }

    applyTranslations();

    function saveVehicle() {
      const t = I18N[getLang()];
      const nameInput = document.getElementById('name');
      const regInput = document.getElementById('regNumber');
      const pollInput = document.getElementById('pollInterval');
      const emailInput = document.getElementById('email');
      const errorDiv = document.getElementById('error');
      const btn = document.getElementById('submitBtn');

      const regNumber = regInput.value.trim().toUpperCase();
      if (!regNumber || regNumber.length < 2) {
        errorDiv.textContent = t.err_invalid_reg;
        errorDiv.style.display = 'block';
        return;
      }

      errorDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = t.btn_checking;

      Homey.emit('add_vehicle', {
        name: nameInput.value.trim() || regNumber,
        regNumber: regNumber,
        pollInterval: parseInt(pollInput.value, 10) || 30,
        email: emailInput.value.trim()
      }, function(err, device) {
        if (err) {
          btn.disabled = false;
          btn.textContent = t.btn_add;
          errorDiv.textContent = err.message || err.toString();
          errorDiv.style.display = 'block';
          return;
        }

        Homey.createDevice(device, function(err) {
          if (err) {
            btn.disabled = false;
            btn.textContent = t.btn_add;
            errorDiv.textContent = err.message || err.toString();
            errorDiv.style.display = 'block';
            return;
          }
          Homey.done();
        });
      });
    }
  </script>
</body>
</html>
