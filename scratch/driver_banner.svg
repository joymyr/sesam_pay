             L 115 118
             C 130 82 160 55 200 50
             L 280 50
             C 310 50 336 68 348 94
             L 370 124
             C 380 130 388 142 388 155
             L 388 184
             C 388 192 382 198 374 198
             L 354 198
             C 350 228 325 250 295 250
             C 265 250 240 228 236 198
             L 154 198
             C 150 228 125 250 95 250
             C 65 250 40 228 36 198
             L 24 198
             C 16 198 10 192 10 184
             L 10 178
             C 10 170 16 164 24 164
             L 40 164 Z"
          fill="url(#carBodyGrad)"/>

    <!-- Windows -->
    <path d="M 122 116 L 195 116 L 195 70 L 170 70 C 145 70 128 90 122 116 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 215 70 L 215 116 L 318 116 L 294 78 C 286 73 276 70 268 70 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Headlight -->
