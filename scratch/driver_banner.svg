    <!-- Wheels -->
    <circle cx="95" cy="200" r="28" fill="#0f172a"/>
    <circle cx="95" cy="200" r="14" fill="#94a3b8"/>
    <circle cx="95" cy="200" r="6" fill="#f8fafc"/>

    <circle cx="295" cy="200" r="28" fill="#0f172a"/>
    <circle cx="295" cy="200" r="14" fill="#94a3b8"/>
    <circle cx="295" cy="200" r="6" fill="#f8fafc"/>
  </g>
</svg>
