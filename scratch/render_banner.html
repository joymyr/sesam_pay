<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 500px;
    height: 350px;
    overflow: hidden;
    background: #020617;
  }
  svg {
    display: block;
    width: 500px;
    height: 350px;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <!-- Background Gradient (Edge-to-Edge) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Radial Glow behind Car -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>

    <!-- Car Body Gradient -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Road / Floor Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Full-bleed background (Edge-to-edge) -->
  <rect x="0" y="0" width="500" height="350" fill="url(#bgGradient)"/>

  <!-- 2. Ambient light circles / subtle tech patterns -->
  <circle cx="250" cy="165" r="160" fill="url(#centerGlow)"/>
  <circle cx="250" cy="165" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="250" cy="165" r="270" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- 3. Road / Floor Plane across the bottom -->
  <rect x="0" y="275" width="500" height="75" fill="url(#roadGrad)"/>
  <line x1="0" y1="275" x2="500" y2="275" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>
  <!-- Road markings -->
  <line x1="40" y1="315" x2="110" y2="315" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="315" x2="240" y2="315" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="315" x2="370" y2="315" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <line x1="430" y1="315" x2="500" y2="315" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>

  <!-- 4. Upper Graphic Elements (Parking 'P' and Payment Waves) -->
  <g filter="url(#softShadow)">
    <!-- Parking 'P' Badge -->
    <g transform="translate(365, 80)">
      <circle cx="0" cy="0" r="42" fill="#ffffff"/>
      <path d="M -12 -22 H 6 C 18 -22 25 -15 25 -5 C 25 5 18 12 6 12 H -2 V 24 H -12 Z M -2 -13 V 3 H 6 C 11 3 15 -1 15 -5 C 15 -9 11 -13 6 -13 Z" fill="#2563eb"/>
    </g>

    <!-- Contactless Payment Waves -->
    <g transform="translate(130, 95)">
      <path d="M -25 20 A 45 45 0 0 1 20 -25" fill="none" stroke="#93c5fd" stroke-width="8" stroke-linecap="round"/>
      <path d="M -12 30 A 28 28 0 0 1 15 2" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="22" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- 5. Main Car Illustration (Vertically and Horizontally Balanced) -->
  <g transform="translate(60, 95)" filter="url(#softShadow)">
    <!-- Car Silhouette -->
    <path d="M 35 170
             L 40 142
             C 44 130 52 120 64 117
             L 110 108
             C 125 72 155 45 195 40
             L 275 40
             C 305 40 330 58 342 84
             L 365 114
             C 375 120 382 132 382 145
             L 382 174
             C 382 182 376 188 368 188
             L 348 188
             C 344 218 319 240 289 240
             C 259 240 234 218 230 188
             L 148 188
             C 144 218 119 240 89 240
             C 59 240 34 218 30 188
             L 18 188
             C 10 188 4 182 4 174
             L 4 168
             C 4 160 10 154 18 154
             L 35 154 Z"
          fill="url(#carBody)"/>

    <!-- Windows -->
    <path d="M 118 106 L 190 106 L 190 60 L 165 60 C 140 60 124 80 118 106 Z" fill="#1e3a8a" opacity="0.9"/>
    <path d="M 210 60 L 210 106 L 312 106 L 288 68 C 280 63 270 60 262 60 Z" fill="#1e3a8a" opacity="0.9"/>

    <!-- Headlight glow -->
    <path d="M 16 158 Q 8 165 16 170 L 32 167 Z" fill="#fde047"/>

    <!-- Left Wheel -->
    <circle cx="89" cy="190" r="28" fill="#0f172a"/>
    <circle cx="89" cy="190" r="14" fill="#64748b"/>
    <circle cx="89" cy="190" r="6" fill="#f8fafc"/>

    <!-- Right Wheel -->
    <circle cx="289" cy="190" r="28" fill="#0f172a"/>
    <circle cx="289" cy="190" r="14" fill="#64748b"/>
    <circle cx="289" cy="190" r="6" fill="#f8fafc"/>
  </g>
</svg>
</body>
</html>
