<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Sesam Pay Overview</title>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #1a1f36;
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:active {
      background: #f3f4f6;
    }
    .vehicle-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .vehicle-card.has-unpaid {
      border-left: 5px solid #ef4444;
    }
    .vehicle-card.ok {
      border-left: 5px solid #10b981;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .vehicle-name {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }
    .reg-badge {
      display: inline-block;
      background: #1e293b;
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.unpaid {
      background: #fee2e2;
      color: #b91c1c;
    }
    .status-badge.paid {
      background: #d1fae5;
      color: #047857;
    }
    .parking-details {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #64748b;
    }
    .detail-value {
      font-weight: 600;
      color: #0f172a;
    }
    .pay-btn {
      display: block;
      width: 100%;
      background-color: #2563eb;
      color: #ffffff !important;
      text-align: center;
      padding: 13px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      margin-top: 14px;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }
    .pay-btn:active {
      background-color: #1d4ed8;
      transform: scale(0.99);
    }
    .sync-single-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #ffffff;
      border-radius: 12px;
      color: #64748b;
    }
    .loader {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚗 Sesam Pay</h1>
    <button class="refresh-btn" onclick="loadStatus()">
      <span>⟳</span> <span id="btn-refresh-text">Refresh</span>
    </button>
  </div>

  <div id="container">
    <div class="loader" id="init-loader">Fetching vehicles and status...</div>
  </div>

  <script>
    const I18N = {
      en: {
        title: "Sesam Pay Overview",
        btn_refresh: "Refresh",
        loading: "Fetching vehicles and status...",
        connecting: "Connecting to Homey...",
        error_fetch: "Error fetching status",
        empty_title: "No vehicles added yet.",
        empty_desc: "Go to <strong>Devices -> Add new device -> Sesam Pay</strong> to add your vehicle.",
        badge_unpaid: "● Unpaid parking",
        badge_paid: "✓ No unpaid sessions",
        facility: "Location / Facility",
        unpaid_amount: "Unpaid amount",
        remaining_time: "Remaining time",
        hours: "hours",
        deadline_unknown: "Deadline unknown",
        btn_pay: "💳 Pay fee-free ({amount} kr) ↗",
        btn_copy_settings: "📋 Copy payment link (for Safari/Chrome)",
        btn_copied_settings: "✓ Link copied! Open in Safari/Chrome",
        all_settled_desc: "All settled. The app automatically monitors new entries and exits.",
        btn_check_now: "⟳ Check now"
      },
      no: {
        title: "Sesam Pay Oversikt",
        btn_refresh: "Oppdater",
        loading: "Henter kjøretøy og status...",
        connecting: "Kobler til Homey...",
        error_fetch: "Feil ved henting av status",
        empty_title: "Ingen kjøretøy lagt til ennå.",
        empty_desc: "Gå til <strong>Enheter -> Legg til ny enhet -> Sesam Pay</strong> for å legge til bilen din.",
        badge_unpaid: "● Ubetalt parkering",
        badge_paid: "✓ Ingen ubetalte",
        facility: "Sted / Anlegg",
        unpaid_amount: "Utestående beløp",
        remaining_time: "Gjenstående tid",
        hours: "timer",
        deadline_unknown: "Frist ukjent",
        btn_pay: "💳 Betal gebyrfritt ({amount} kr) ↗",
        btn_copy_settings: "📋 Kopier betalingslenke (til Safari/Chrome)",
        btn_copied_settings: "✓ Lenke kopiert! Åpne i Safari/Chrome",
        all_settled_desc: "Alt er oppgjort. Appen overvåker automatisk nye inn- og utkjøringer.",
        btn_check_now: "⟳ Sjekk nå"
      }
    };

    function getLang() {
      const h = homeyInstance || window.Homey;
      const lang = (h && (typeof h.getLanguage === 'function' ? h.getLanguage() : h.language)) || navigator.language || 'en';
      return lang.startsWith('no') || lang.startsWith('nb') || lang.startsWith('nn') ? 'no' : 'en';
    }

    let homeyInstance = null;

    function onHomeyReady(Homey) {
      homeyInstance = Homey;
      Homey.ready();
      applyHeaderTranslations();
      loadStatus();
    }

    function applyHeaderTranslations() {
      const t = I18N[getLang()];
      document.title = t.title;
      const refText = document.getElementById('btn-refresh-text');
      if (refText) refText.textContent = t.btn_refresh;
      const initLoader = document.getElementById('init-loader');
      if (initLoader) initLoader.textContent = t.loading;
    }

    function loadStatus() {
      const t = I18N[getLang()];
      const container = document.getElementById('container');
      const h = homeyInstance || window.Homey;

      if (!h || typeof h.api !== 'function') {
        container.innerHTML = `<div class="loader">${t.connecting}</div>`;
        return;
      }

      h.api('GET', '/status', function(err, vehicles) {
        if (err) {
          container.innerHTML = `<div class="empty-state">${t.error_fetch}: ${err.message || JSON.stringify(err)}</div>`;
          return;
        }

        if (!vehicles || vehicles.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p>${t.empty_title}</p>
              <p style="font-size: 13px; margin-top: 8px;">${t.empty_desc}</p>
            </div>
          `;
          return;
        }

        renderVehicles(vehicles);
      });
    }

    function renderVehicles(vehicles) {
      const t = I18N[getLang()];
      const container = document.getElementById('container');
      let html = '';

      vehicles.forEach(v => {
        const isUnpaid = v.hasUnpaid;
        const cardClass = isUnpaid ? 'has-unpaid' : 'ok';
        const badgeClass = isUnpaid ? 'unpaid' : 'paid';
        const badgeText = isUnpaid ? t.badge_unpaid : t.badge_paid;

        html += `
          <div class="vehicle-card ${cardClass}">
            <div class="card-top">
              <div>
                <div class="vehicle-name">${escapeHtml(v.name)}</div>
                <div class="reg-badge">${escapeHtml(v.regNumber)}</div>
              </div>
              <div class="status-badge ${badgeClass}">${badgeText}</div>
            </div>
        `;

        if (isUnpaid) {
          const hoursLeft = v.hoursRemaining !== undefined ? `${v.hoursRemaining} ${t.hours}` : t.deadline_unknown;
          const targetUrl = v.paymentUrl || 'https://sesam-sesam.com/betal-for-parkering/';
          const payText = t.btn_pay.replace('{amount}', v.amount);

          html += `
            <div class="parking-details">
              <div class="detail-row">
                <span class="detail-label">${t.facility}</span>
                <span class="detail-value">${escapeHtml(v.facility)}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.unpaid_amount}</span>
                <span class="detail-value" style="color: #b91c1c;">${v.amount} NOK</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.remaining_time}</span>
                <span class="detail-value">${hoursLeft}</span>
              </div>
            </div>

            <a href="${targetUrl}" target="_blank" class="pay-btn" onclick="openPayment('${targetUrl}', event)">
              ${payText}
            </a>
            <button class="sync-single-btn" style="width:100%; margin-top:8px; padding:10px;" onclick="copySettingsUrl('${targetUrl}', this)">
              ${t.btn_copy_settings}
            </button>
          `;
        } else {
          html += `
            <p style="color: #64748b; font-size: 13px; margin-top: 8px;">
              ${t.all_settled_desc}
            </p>
          `;
        }

        html += `
            <button class="sync-single-btn" onclick="syncVehicle('${v.id}')">${t.btn_check_now}</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function copySettingsUrl(url, btn) {
      const t = I18N[getLang()];
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(url).then(() => showSettingsCopied(btn));
      } else {
        const input = document.createElement('textarea');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showSettingsCopied(btn);
      }
    }

    function showSettingsCopied(btn) {
      const t = I18N[getLang()];
      if (btn) {
        const orig = btn.innerText;
        btn.innerText = t.btn_copied_settings;
        btn.style.background = '#d1fae5';
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.background = 'transparent';
        }, 4000);
      }
    }

    function openPayment(url, event) {
      const h = homeyInstance || window.Homey;
      if (h && typeof h.openURL === 'function') {
        if (event) event.preventDefault();
        h.openURL(url);
      }
    }

    function syncVehicle(vehicleId) {
      const t = I18N[getLang()];
      const container = document.getElementById('container');
      container.innerHTML = `<div class="loader">${t.loading}</div>`;

      const h = homeyInstance || window.Homey;
      if (!h || typeof h.api !== 'function') return;

      h.api('POST', '/sync', { id: vehicleId }, function(err, result) {
        loadStatus();
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
