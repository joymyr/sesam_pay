<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sesam Pay Oversikt</title>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #1a1f36;
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:active {
      background: #f3f4f6;
    }
    .vehicle-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .vehicle-card.has-unpaid {
      border-left: 5px solid #ef4444;
    }
    .vehicle-card.ok {
      border-left: 5px solid #10b981;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .vehicle-name {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }
    .reg-badge {
      display: inline-block;
      background: #1e293b;
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.unpaid {
      background: #fee2e2;
      color: #b91c1c;
    }
    .status-badge.paid {
      background: #d1fae5;
      color: #047857;
    }
    .parking-details {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #64748b;
    }
    .detail-value {
      font-weight: 600;
      color: #0f172a;
    }
    .pay-btn {
      display: block;
      width: 100%;
      background-color: #2563eb;
      color: #ffffff !important;
      text-align: center;
      padding: 13px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      margin-top: 14px;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }
    .pay-btn:active {
      background-color: #1d4ed8;
      transform: scale(0.99);
    }
    .sync-single-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #ffffff;
      border-radius: 12px;
      color: #64748b;
    }
    .loader {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚗 Sesam Pay</h1>
    <button class="refresh-btn" onclick="loadStatus()">
      <span>⟳</span> Oppdater
    </button>
  </div>

  <div id="container">
    <div class="loader">Henter kjøretøy og status...</div>
  </div>

  <script>
    let homeyInstance = null;

    function onHomeyReady(Homey) {
      homeyInstance = Homey;
      Homey.ready();
      loadStatus();
    }

    function loadStatus() {
      const container = document.getElementById('container');
      const h = homeyInstance || window.Homey;

      if (!h || typeof h.api !== 'function') {
        container.innerHTML = '<div class="loader">Kobler til Homey...</div>';
        return;
      }

      h.api('GET', '/status', function(err, vehicles) {
        if (err) {
          container.innerHTML = `<div class="empty-state">Feil ved henting av status: ${err.message || JSON.stringify(err)}</div>`;
          return;
        }

        if (!vehicles || vehicles.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p>Ingen kjøretøy lagt til ennå.</p>
              <p style="font-size: 13px; margin-top: 8px;">Gå til <strong>Enheter -> Legg til ny enhet -> Sesam Pay</strong> for å legge til bilen din.</p>
            </div>
          `;
          return;
        }

        renderVehicles(vehicles);
      });
    }

    function renderVehicles(vehicles) {
      const container = document.getElementById('container');
      let html = '';

      vehicles.forEach(v => {
        const isUnpaid = v.hasUnpaid;
        const cardClass = isUnpaid ? 'has-unpaid' : 'ok';
        const badgeClass = isUnpaid ? 'unpaid' : 'paid';
        const badgeText = isUnpaid ? '● Ubetalt parkering' : '✓ Ingen ubetalte';

        html += `
          <div class="vehicle-card ${cardClass}">
            <div class="card-top">
              <div>
                <div class="vehicle-name">${escapeHtml(v.name)}</div>
                <div class="reg-badge">${escapeHtml(v.regNumber)}</div>
              </div>
              <div class="status-badge ${badgeClass}">${badgeText}</div>
            </div>
        `;

        if (isUnpaid) {
          const hoursLeft = v.hoursRemaining !== undefined ? `${v.hoursRemaining} timer` : 'Frist ukjent';
          const targetUrl = v.paymentUrl || 'https://sesam-sesam.com/betal-for-parkering/';

          html += `
            <div class="parking-details">
              <div class="detail-row">
                <span class="detail-label">Sted / Anlegg</span>
                <span class="detail-value">${escapeHtml(v.facility)}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Utestående beløp</span>
                <span class="detail-value" style="color: #b91c1c;">${v.amount} NOK</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Gjenstående tid</span>
                <span class="detail-value">${hoursLeft}</span>
              </div>
            </div>

            <a href="${targetUrl}" target="_blank" class="pay-btn" onclick="openPayment('${targetUrl}', event)">
              💳 Betal gebyrfritt (${v.amount} kr) ↗
            </a>
          `;
        } else {
          html += `
            <p style="color: #64748b; font-size: 13px; margin-top: 8px;">
              Alt er oppgjort. Appen overvåker automatisk nye inn- og utkjøringer.
            </p>
          `;
        }

        html += `
            <button class="sync-single-btn" onclick="syncVehicle('${v.id}')">⟳ Sjekk nå</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function openPayment(url, event) {
      const h = homeyInstance || window.Homey;
      if (h && typeof h.openURL === 'function') {
        if (event) event.preventDefault();
        h.openURL(url);
      }
    }

    function syncVehicle(vehicleId) {
      const container = document.getElementById('container');
      container.innerHTML = '<div class="loader">Sjekker Sesam Sesam...</div>';

      const h = homeyInstance || window.Homey;
      if (!h || typeof h.api !== 'function') return;

      h.api('POST', '/sync', { id: vehicleId }, function(err, result) {
        loadStatus();
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
