<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Sesam Pay Overview</title>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #1a1f36;
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:active {
      background: #f3f4f6;
    }
    .vehicle-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .vehicle-card.has-unpaid {
      border-left: 5px solid #ef4444;
    }
    .vehicle-card.ok {
      border-left: 5px solid #10b981;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .vehicle-name {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }
    .reg-badge {
      display: inline-block;
      background: #1e293b;
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.unpaid {
      background: #fee2e2;
      color: #b91c1c;
    }
    .status-badge.paid {
      background: #d1fae5;
      color: #047857;
    }
    .parking-details {
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      .header h1 {
        color: #f8fafc;
      }
      .vehicle-card {
        background-color: #1e293b !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
      }
      .vehicle-name {
        color: #f8fafc !important;
      }
      .parking-details {
        background: rgba(255, 255, 255, 0.05) !important;
        border-color: #334155 !important;
      }
      .detail-row {
        border-bottom-color: #334155 !important;
      }
      .detail-label {
        color: #94a3b8 !important;
      }
      .detail-value {
        color: #f8fafc !important;
      }
      .tip-box {
        background-color: #1e3a5f !important;
        border-color: #2563eb !important;
        color: #bfdbfe !important;
      }
      .refresh-btn {
        background-color: #1e293b !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
      }
      .sync-single-btn {
        border-color: #475569 !important;
        color: #94a3b8 !important;
      }
      .empty-state {
        background-color: #1e293b !important;
        color: #94a3b8 !important;
      }
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #64748b;
    }
    .detail-value {
      font-weight: 600;
      color: #0f172a;
    }
    .pay-btn {
      display: block !important;
      width: 100% !important;
      background-color: #2563eb !important;
      color: #ffffff !important;
      text-align: center !important;
      padding: 14px 16px !important;
      border-radius: 8px !important;
      text-decoration: none !important;
      font-weight: 700 !important;
      font-size: 15px !important;
      margin-top: 12px !important;
      border: none !important;
      outline: none !important;
      cursor: pointer !important;
      -webkit-appearance: none !important;
      appearance: none !important;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3) !important;
      transition: background-color 0.2s, transform 0.1s !important;
    }
    .pay-btn:active {
      background-color: #1d4ed8 !important;
      transform: scale(0.98) !important;
    }
    .pay-btn.copied {
      background-color: #059669 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3) !important;
    }
    .sync-single-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #ffffff;
      border-radius: 12px;
      color: #64748b;
    }
    .loader {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚗 Sesam Pay</h1>
    <button class="refresh-btn" onclick="loadStatus()">
      <span>⟳</span> <span id="btn-refresh-text">Refresh</span>
    </button>
  </div>

  <div id="container">
    <div class="loader" id="init-loader">Fetching vehicles and status...</div>
  </div>

  <script>
    const I18N = {
      en: {
        title: "Sesam Pay Overview",
        btn_refresh: "Refresh",
        loading: "Fetching vehicles and status...",
        connecting: "Connecting to Homey...",
        error_fetch: "Error fetching status",
        empty_title: "No vehicles added yet.",
        empty_desc: "Go to <strong>Devices -> Add new device -> Sesam Pay</strong> to add your vehicle.",
        badge_unpaid: "● Unpaid parking",
        badge_paid: "✓ No unpaid sessions",
        facility: "Location / Facility",
        unpaid_amount: "Unpaid amount",
        remaining_time: "Remaining time",
        hours: "hours",
        btn_copy: "📋 Copy payment link ({amount} kr)",
        btn_copied: "✓ Payment link copied!",
        tip_text: "💡 <strong>Tip:</strong> Tap «Copy payment link» and open in Safari or Chrome to complete payment with BankID or Vipps.",
        all_settled_desc: "All settled. The app automatically monitors new entries and exits.",
        btn_check_now: "⟳ Check now"
      },
      no: {
        title: "Sesam Pay Oversikt",
        btn_refresh: "Oppdater",
        loading: "Henter kjøretøy og status...",
        connecting: "Kobler til Homey...",
        error_fetch: "Feil ved henting av status",
        empty_title: "Ingen kjøretøy lagt til ennå.",
        empty_desc: "Gå til <strong>Enheter -> Legg til ny enhet -> Sesam Pay</strong> for å legge til bilen din.",
        badge_unpaid: "● Ubetalt parkering",
        badge_paid: "✓ Ingen ubetalte",
        facility: "Sted / Anlegg",
        unpaid_amount: "Utestående beløp",
        remaining_time: "Gjenstående tid",
        hours: "timer",
        deadline_unknown: "Frist ukjent",
        btn_copy: "📋 Kopier betalingslenke ({amount} kr)",
        btn_copied: "✓ Betalingslenke kopiert!",
        tip_text: "💡 <strong>Tips:</strong> Trykk «Kopier betalingslenke» og lim inn i nettleser (Safari/Chrome) for å fullføre betaling med BankID eller Vipps.",
        all_settled_desc: "Alt er oppgjort. Appen overvåker automatisk nye inn- og utkjøringer.",
        btn_check_now: "⟳ Sjekk nå"
      }
    };

    function getLang() {
      try {
        let str = '';
        const h = (typeof homeyInstance !== 'undefined' && homeyInstance) || window.Homey;
        if (h) {
          if (typeof h.language === 'string') {
            str = h.language;
          } else if (typeof h.getLanguage === 'string') {
            str = h.getLanguage;
          }
        }
        if (!str && typeof navigator !== 'undefined') {
          str = navigator.language || navigator.userLanguage || '';
        }
        str = String(str || '').toLowerCase();
        if (str.indexOf('no') === 0 || str.indexOf('nb') === 0 || str.indexOf('nn') === 0) {
          return 'no';
        }
        return 'en';
      } catch (e) {
        return 'en';
      }
    }

    let homeyInstance = null;

    function onHomeyReady(Homey) {
      homeyInstance = Homey;
      if (typeof Homey.ready === 'function') {
        Homey.ready();
      }
      applyHeaderTranslations();
      loadStatus();
    }

    function applyHeaderTranslations() {
      const t = I18N[getLang()];
      document.title = t.title;
      const refText = document.getElementById('btn-refresh-text');
      if (refText) refText.textContent = t.btn_refresh;
      const initLoader = document.getElementById('init-loader');
      if (initLoader) initLoader.textContent = t.loading;
    }


    function loadStatus() {
      const t = I18N[getLang()];
      const container = document.getElementById('container');
      const h = homeyInstance || window.Homey;

      if (!h || typeof h.api !== 'function') {
        container.innerHTML = `<div class="loader">${t.connecting}</div>`;
        return;
      }

      h.api('GET', '/status', function(err, vehicles) {
        if (err) {
          container.innerHTML = `<div class="empty-state">${t.error_fetch}: ${err.message || JSON.stringify(err)}</div>`;
          return;
        }

        if (!vehicles || vehicles.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p>${t.empty_title}</p>
              <p style="font-size: 13px; margin-top: 8px;">${t.empty_desc}</p>
            </div>
          `;
          return;
        }

        renderVehicles(vehicles);
      });
    }

    function renderVehicles(vehicles) {
      const t = I18N[getLang()];
      const container = document.getElementById('container');
      let html = '';

      vehicles.forEach(v => {
        const isUnpaid = v.hasUnpaid;
        const cardClass = isUnpaid ? 'has-unpaid' : 'ok';
        const badgeClass = isUnpaid ? 'unpaid' : 'paid';

        const parkings = (v.parkings && v.parkings.length > 0)
          ? v.parkings
          : (isUnpaid ? [{
              facility: v.facility,
              amount: v.amount,
              hoursRemaining: v.hoursRemaining,
              paymentUrl: v.paymentUrl,
            }] : []);

        const hasMultiple = parkings.length > 1;
        const uniqueFacilities = Array.from(new Set(parkings.map(p => (p.facility || '').trim()).filter(Boolean)));
        
        let badgeText = isUnpaid ? t.badge_unpaid : t.badge_paid;
        if (isUnpaid && hasMultiple) {
          badgeText = `● ${parkings.length} ${getLang() === 'no' ? 'ubetalte' : 'unpaid'}`;
        }

        html += `
          <div class="vehicle-card ${cardClass}">
            <div class="card-top">
              <div>
                <div class="vehicle-name">${escapeHtml(v.name)}</div>
                <div class="reg-badge">${escapeHtml(v.regNumber)}</div>
              </div>
              <div class="status-badge ${badgeClass}">${badgeText}</div>
            </div>
        `;

        if (isUnpaid) {
          let summaryHtml = '';
          if (hasMultiple) {
            const facSummary = uniqueFacilities.length > 1
              ? `${uniqueFacilities.length} ulike anlegg: ${uniqueFacilities.map(f => escapeHtml(f)).join(', ')}`
              : `${escapeHtml(uniqueFacilities[0] || v.facility)}`;
            summaryHtml = `
              <div style="margin: 10px 0 8px 0; font-size: 13px; font-weight: 700; color: #b91c1c;">
                ● ${parkings.length} ubetalte parkeringer (${facSummary}) – Totalt: ${v.amount} NOK
              </div>
            `;
          } else if (parkings.length === 1) {
            summaryHtml = `
              <div style="margin: 10px 0 8px 0; font-size: 13px; font-weight: 700; color: #b91c1c;">
                ● 1 ubetalt parkering – ${v.amount} NOK
              </div>
            `;
          }
          html += summaryHtml;

          parkings.forEach((p, idx) => {
            const hoursLeft = p.hoursRemaining !== undefined ? `${p.hoursRemaining} ${t.hours}` : t.deadline_unknown;
            const targetUrl = p.paymentUrl || v.paymentUrl || 'https://sesam-sesam.com/betal-for-parkering/';
            const payText = t.btn_copy.replace('{amount}', p.amount);
            const ownerInfo = p.owner ? ` (${escapeHtml(p.owner)})` : '';
            const timeInfo = (p.startTimeStr && p.endTimeStr) ? `${escapeHtml(p.startTimeStr)} – ${escapeHtml(p.endTimeStr)}` : '';

            html += `
              <div class="parking-details" style="${hasMultiple ? 'border-left: 3px solid #ef4444; margin-bottom: 12px;' : ''}">
                <div class="detail-row">
                  <span class="detail-label">${t.facility}</span>
                  <span class="detail-value">${escapeHtml(p.facility)}${ownerInfo}</span>
                </div>
                ${timeInfo ? `
                  <div class="detail-row">
                    <span class="detail-label">Tid</span>
                    <span class="detail-value" style="font-size: 12px;">${timeInfo}</span>
                  </div>
                ` : ''}
                <div class="detail-row">
                  <span class="detail-label">${t.unpaid_amount}</span>
                  <span class="detail-value" style="color: #b91c1c;">${p.amount} NOK</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">${t.remaining_time}</span>
                  <span class="detail-value">${hoursLeft}</span>
                </div>

                <button class="pay-btn" style="cursor: pointer; border: none; outline: none; margin-top: 10px; width: 100%; font-family: inherit;" onclick="copySettingsUrl('${targetUrl}', this)">
                  ${payText}
                </button>
              </div>
            `;
          });

          html += `
            <div style="background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 10px; font-size: 12px; color: #1e40af; margin: 10px 0 14px 0; line-height: 1.4;">
              ${t.tip_text}
            </div>
          `;
        } else {
          html += `
            <p style="color: #64748b; font-size: 13px; margin-top: 8px;">
              ${t.all_settled_desc}
            </p>
          `;
        }

        html += `
            <button class="sync-single-btn" onclick="syncVehicle('${v.id}')">${t.btn_check_now}</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function copySettingsUrl(url, btn) {
      const t = I18N[getLang()];
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(url).then(() => showSettingsCopied(btn));
      } else {
        const input = document.createElement('textarea');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showSettingsCopied(btn);
      }
    }

    function showSettingsCopied(btn) {
      const t = I18N[getLang()];
      if (btn) {
        const orig = btn.innerText;
        btn.innerText = t.btn_copied;
        btn.style.backgroundColor = '#059669';
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.backgroundColor = '#2563eb';
        }, 3500);
      }
    }

    function openPayment(url, event) {
      const h = homeyInstance || window.Homey;
      if (h && typeof h.openURL === 'function') {
        if (event) event.preventDefault();
        h.openURL(url);
      }
    }

    function syncVehicle(vehicleId) {
      const t = I18N[getLang()];
      const container = document.getElementById('container');
      container.innerHTML = `<div class="loader">${t.loading}</div>`;

      const h = homeyInstance || window.Homey;
      if (!h || typeof h.api !== 'function') return;

      h.api('POST', '/sync', { id: vehicleId }, function(err, result) {
        loadStatus();
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
